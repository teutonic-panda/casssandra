<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condições — Cassandra</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 { color: #60a5fa; }

  #search {
    width: 240px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background-color: #1e293b;
    color: #e2e8f0;
    margin-bottom: 20px;
  }

  /* CONTAINER PRINCIPAL PARA LADO A LADO */
  .main-content {
    display: flex;
    flex-direction: row; /* Coloca os itens em linha */
    align-items: flex-start; /* Alinha ambos pelo topo */
    gap: 25px; /* Espaço entre tabela e resultado */
    max-width: 1000px;
    width: 100%;
    justify-content: center;
  }

  #table-container {
    overflow-x: auto;
    flex: 1; /* Tabela cresce conforme necessário */
  }

  #result {
    position: sticky; /* Faz o quadro seguir a rolagem */
    top: 20px;       /* Distância do topo da tela ao "grudar" */
    background-color: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 20px;
    width: 320px;     /* Largura fixa para o resultado */
    min-height: 100px;
    max-height: 80vh; /* Não ultrapassa a altura da tela */
    overflow-y: auto;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }

  table {
    border-collapse: collapse;
    background-color: #1e293b;
    border-radius: 8px;
    overflow: hidden;
    width: 100%;
  }

  th, td {
    padding: 10px 15px;
    text-align: left;
    border-bottom: 1px solid #334155;
  }

  th { background-color: #1e293b; color: #93c5fd; border-bottom: 2px solid #334155; }
  tr:hover { background-color: #334155; cursor: pointer; }
  td.id { color: #64748b; font-size: 0.9em; width: 40px; }
  td.name { font-weight: bold; color: #e2e8f0; }

  /* Ajuste para telas pequenas */
  @media (max-width: 768px) {
    .main-content { flex-direction: column-reverse; align-items: center; }
    #result { position: static; width: 100%; box-sizing: border-box; }
  }
</style>
</head>
<body>
  <h1>Condições</h1>
  <input type="text" id="search" placeholder="Buscar condição...">

  <!-- Novo container para organizar o layout -->
  <div class="main-content">
    <div id="table-container">
      <table id="conditionsTable">
        <thead>
          <tr><th>ID</th><th>Condição</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="result">
      <p style="color: #64748b;">Selecione ou pesquise uma condição para ver os detalhes aqui...</p>
    </div>
  </div>

<script>
  const url = "https://raw.githubusercontent.com/teutonic-panda/casssandra/main/conditions.json";
  let conditions = [];

  fetch(url)
    .then(response => response.json())
    .then(data => {
      conditions = data;
      const tbody = document.querySelector("#conditionsTable tbody");
      data.forEach(cond => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td class="id">${cond.id}</td><td class="name">${cond.nome}</td>`;
        tr.addEventListener("click", () => showCondition(cond));
        tbody.appendChild(tr);
      });
    });

  const resultBox = document.getElementById("result");

  function showCondition(cond) {
    resultBox.innerHTML = `
      <h3 style="margin-top:0; color:#60a5fa;">${cond.nome}</h3>
      <p style="line-height:1.5;">${cond.descricao || "Sem descrição disponível."}</p>
    `;
  }

  document.getElementById("search").addEventListener("input", function() {
    const query = this.value.toLowerCase();
    if(query === "") return;
    const cond = conditions.find(c => c.nome.toLowerCase().includes(query));
    if (cond) showCondition(cond);
  });
</script>
</body>
</html>
